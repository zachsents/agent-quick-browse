# Every push to main: check, pick the next version from commit messages, publish to npm (trusted publishing, no token),
# then tag and create a GitHub release. Add "[skip release]" to a commit message to skip.
name: Release

on:
  push:
    branches: [main]

concurrency: release

permissions:
  contents: write # push tags, create releases
  id-token: write # npm trusted publishing + provenance

jobs:
  release:
    if: ${{ !contains(github.event.head_commit.message, '[skip release]') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: oven-sh/setup-bun@v2

      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1
      - run: npm install -g npm@latest

      - run: bun install --frozen-lockfile

      - run: bun run ci

      - id: version
        run: bun scripts/next-version.ts >> "$GITHUB_OUTPUT"

      - if: steps.version.outputs.version
        run: npm version "${{ steps.version.outputs.version }}" --no-git-tag-version

      - if: steps.version.outputs.version
        run: npm publish --provenance --access public

      - if: steps.version.outputs.version
        env:
          GH_TOKEN: ${{ github.token }}
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          git tag "v$VERSION"
          git push origin "v$VERSION"
          gh release create "v$VERSION" --generate-notes --title "v$VERSION"
